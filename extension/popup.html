<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>body{width:340px;padding:14px} .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)} .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.run{background:var(--acc);animation:p 1s infinite alternate} @keyframes p{to{opacity:.3}}</style></head>
<body>
  <div class="row">
    <h1><img src="icons/48.png" alt="">Aside Sync</h1>
    <a href="#" id="opts" class="muted">설정</a>
  </div>

  <div id="upd" class="card" hidden>
    <div class="row"><span id="updText"></span><button id="updBtn">업데이트</button></div>
  </div>

  <div class="card">
    <div class="row"><span>이 PC</span><b id="device">-</b></div>
    <div class="row"><span>상태</span><span><span id="dot" class="dot"></span><span id="state">-</span></span></div>
    <div class="row"><span>마지막 동기화</span><span id="last">-</span></div>
    <div class="row"><span>자동 동기화</span><span id="sched">-</span></div>
    <div class="row"><span>동기화 대상</span><span id="dir" class="muted" style="max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl">-</span></div>
    <button id="fixSched" hidden style="width:100%;margin-top:8px">자동 동기화 다시 등록</button>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:6px">최근 결과 (채팅 / 파일)</div>
    <div class="grid">
      <div><b id="sUp">0</b><span class="muted">채팅 ↑</span></div>
      <div><b id="sDown">0</b><span class="muted">채팅 ↓</span></div>
      <div><b id="fUp">0</b><span class="muted">파일 ↑</span></div>
      <div><b id="fDown">0</b><span class="muted">파일 ↓</span></div>
    </div>
    <div id="notes" class="muted" style="margin-top:6px"></div>
  </div>

  <div id="blocked" class="card" hidden>
    <div id="blockedText"></div>
    <details><summary class="muted">목록 보기</summary><div id="blockedList" class="muted" style="max-height:120px;overflow:auto;word-break:break-all"></div></details>
    <div class="row" style="margin-top:8px;gap:6px">
      <button id="allowDel" style="flex:1">삭제 받아들이기</button>
      <button id="keepLocal" style="flex:1">이 PC 파일로 되살리기</button>
    </div>
    <div class="muted" style="margin-top:4px">삭제되는 파일은 ~/.aside-sync/conflicts 에 백업됩니다. 되살리면 다른 PC에도 다시 퍼집니다.</div>
  </div>

  <div id="msg" style="margin-top:10px;min-height:18px" class="muted"></div>
  <button id="sync" class="primary" style="width:100%;margin-top:6px">지금 동기화</button>

  <h2>연결된 PC</h2>
  <div id="devices" class="muted">-</div>
  <script src="popup.js"></script>
</body>
</html>
